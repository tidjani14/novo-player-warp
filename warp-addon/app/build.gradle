plugins { id 'com.android.application' }

android {
    namespace 'com.alisat.warpaddon'
    compileSdk 35
    defaultConfig {
        applicationId 'com.alisat.warpaddon'
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName '1.0'
        multiDexEnabled true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
}

// The Go/gomobile runtime AAR contains its Java bindings and native libraries.
android.sourceSets.main.jniLibs.srcDirs = []

dependencies {
    // Rebuilt from the pinned upstream Go source with Android socket protection.
    implementation files('libs/usque-android.aar')
}
